# El nom del projecte no depèn del nom del directori: així es pot moure la
# carpeta de desplegament sense recrear la xarxa ni els contenidors.
name: territoriadf

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: territoriadf-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "51823:51823"
    expose:
      - "1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/certs:/mosquitto/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - territoriadf-net
    healthcheck:
      test: ["CMD", "pidof", "mosquitto"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10s

  backend:
    image: territoriadf-backend:latest
    build:
      # Context a l'arrel perquè la imatge s'instal·li amb el package-lock.json únic
      # del monorepo (workspaces); vegeu .dockerignore de l'arrel.
      context: .
      dockerfile: back/Dockerfile
    container_name: territoriadf-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3034:3033"
    env_file:
      - ./back/.env
    volumes:
      - ./back/data:/app/data
    networks:
      - territoriadf-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3033/api/adfs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: territoriadf-frontend:latest
    build:
      context: .
      dockerfile: front/Dockerfile
    container_name: territoriadf-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - territoriadf-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  territoriadf-net:
    driver: bridge

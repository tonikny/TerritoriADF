name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Versió única per a local, CI i Docker: es llegeix de `.nvmrc`.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test -w packages/contracts

      - run: npm run lint

      - run: npm run db:migrate -w back

      - run: npm run db:check -w back

      - run: npm run test:coverage -w back

      - run: npm run test:coverage -w front

      - run: npm run build

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Bloquejar fitxers ocults (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 2. Bloquejar tecnologies no usades (evita Soft 404 i ajuda a CrowdSec)
    location ~* \.(php|aspx|jsp|cgi|env)$ {
        return 404;
        access_log off;
        log_not_found off;
    }

    # 3. PWA: el service worker i el manifest s'han de revalidar sempre
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~ ^/workbox-[\w-]+\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 4. Assets versionats per Vite: es poden cachejar per sempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 5. Suport per a aplicacions React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy per a l'API (quan es corre dins de Docker Compose)
    # Nota: En producció el Nginx del host gestiona això, 
    # però això és útil per a tests locals amb Docker.
    location /api/ {
        proxy_pass http://backend:3033/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
